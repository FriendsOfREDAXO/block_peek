package: block_peek
version: '1.6.0-beta4'
license: MIT
author: Friends Of REDAXO, Yves Torres
supportpage: https://github.com/FriendsOfREDAXO/block_peek
perm: block_peek[]

console_commands:
  block_peek:generate: FriendsOfRedaxo\BlockPeek\Command\GenerateCommand

default_config:
  picker_provider: auto
  picker_effort: medium
  picker_context_paths: "src/fragments/**\nsrc/assets/css/components/**\nsrc/assets/css/theme/tokens.css\nsrc/assets/css/utils/fluid-grid.css"

page:
  title: 'translate:block_peek_title'
  icon: rex-icon fa-vr-cardboard
  perm: block_peek[]
  subpages:
    settings:
      title: 'translate:block_peek_settings'
      icon: rex-icon fa-cog
    picker:
      title: 'translate:block_peek_picker_title'
      icon: rex-icon fa-th-large
      perm: admin[]
    docs:
      title: 'translate:block_peek_docs'
      subPath: README.md
      icon: rex-icon fa-book
      itemclass: pull-right

requires:
  redaxo: '^5.17.0'
  php:
    version: '>=8.2'

installer_ignore:
  - tests
  - node_modules
  - assets-src
  - block_peek.zip
  - block_peek.png
  - scripts
  - .prettierrc
  - .stylelintrc.json
  - jsconfig.json
  - package.json
  - package-lock.json
  - postcss.config.js
  - vite.config.mjs
